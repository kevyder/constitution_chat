[project]
name = "constitution"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "qdrant-client==1.19.0",
    "pymupdf==1.28.2",
    "python-dotenv==1.2.3",
    "tqdm==4.70.0",
    "streamlit==1.61.1",
    "langchain==1.3.15",
    "langchain-core==1.5.6",
    "langchain-openai==1.5.2",
    "langchain-qdrant==1.1.0",
    "langfuse==4.14.4",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit (==4.6.2)",
    "ruff (==0.16.3)",
]

[tool.uv]
package = false


# Ruff configuration
[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isort
]
ignore = ["E203", "E305"]

[tool.ruff.lint.pydocstyle]
convention = "google"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
