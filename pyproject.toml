[project]
name = "constitution"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "qdrant-client==1.20.0",
    "pymupdf==2.1",
    "python-dotenv==1.2.4",
    "tqdm==4.70.1",
    "streamlit==1.67.0",
    "langchain==1.5.2",
    "langchain-core==1.8.4",
    "langchain-openai==1.8.5",
    "langchain-qdrant==1.1.0",
    "langfuse==5.2.0",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pre-commit (==4.7.0)",
    "ruff (==0.17.6)",
]

[tool.uv]
package = false


# Ruff configuration
[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # Pyflakes
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "I", # isort
]
ignore = ["E203", "E305"]

[tool.ruff.lint.pydocstyle]
convention = "google"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []
